name: Karryman Backtest del sistema
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Número de acciones de la muestra aleatoria'
        required: false
        default: '700'
      seed:
        description: 'Semilla de la muestra (cambiar para validar con otra muestra)'
        required: false
        default: '42'
      contact:
        description: 'Contacto exigido por la SEC en el User-Agent (solo modos sec_smoke y fundamentales)'
        required: false
        default: ''
      mode:
        description: 'variantes | comparacion_spy | indice_apalancado | senales_tempranas | sec_smoke | fundamentales | panel'
        required: false
        default: 'variantes'
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: pip install -r requirements.txt
      - name: Tests del motor
        run: python -m unittest tests.test_system_backtest -v
      - name: Preparar contacto de la SEC (enmascarado)
        env:
          SEC_SECRET: ${{ secrets.SEC_CONTACT }}
        run: |
          C="$SEC_SECRET"
          if [ -z "$C" ]; then C=$(jq -r '.inputs.contact // empty' "$GITHUB_EVENT_PATH"); fi
          if [ -n "$C" ]; then
            echo "::add-mask::$C"
            echo "SEC_CONTACT=$C" >> "$GITHUB_ENV"
          fi
      - name: Backtest (investigación, sin órdenes)
        env:
          SYMBOLS: ${{ inputs.symbols }}
          SEED: ${{ inputs.seed }}
          MODE: ${{ inputs.mode }}
        run: |
          EXTRA=""
          if [ "$MODE" = "indice_apalancado" ]; then python index_leverage.py data/system_backtest.json; exit 0; fi
          if [ "$MODE" = "sec_smoke" ]; then python sec_fundamentals.py --smoke; exit 0; fi
          if [ "$MODE" = "panel" ]; then python panel_study.py --symbols "$SYMBOLS" --output data/system_backtest.json; exit 0; fi
          if [ "$MODE" = "fundamentales" ]; then python fundamental_study.py --symbols "$SYMBOLS" --output data/system_backtest.json; exit 0; fi
          if [ "$MODE" = "senales_tempranas" ]; then python early_signals.py --symbols "$SYMBOLS" --output data/system_backtest.json; exit 0; fi
          if [ "$MODE" = "comparacion_spy" ]; then EXTRA="--benchmark"; fi
          python system_backtest.py --symbols "$SYMBOLS" --seed "$SEED" --output data/system_backtest.json $EXTRA
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karryman-system-backtest
          path: |
            data/system_backtest.json
            data/panel.csv.gz
            data/sec_rows.json.gz
          if-no-files-found: warn
          retention-days: 90
