name: Karryman V24 backtest
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'backtest | fuentes | tests | hipotesis | replica_h2 | tiingo | tiingo_limites | h5 | h6 | h7 | h7_explor | h8'
        required: false
        default: 'backtest'
      symbols:
        description: 'Número de acciones (muestra aleatoria de cotizadas hoy)'
        required: false
        default: '300'
      seed:
        description: 'Semilla de la muestra'
        required: false
        default: '42'
      capital:
        description: 'Capital inicial en dólares'
        required: false
        default: '3000'
      fee_min:
        description: 'Comisión mínima por orden (hipotética)'
        required: false
        default: '1.0'
      min_order:
        description: 'Importe mínimo por orden'
        required: false
        default: '100'
      fractional:
        description: 'Acciones fraccionarias (true/false)'
        required: false
        default: 'false'
      source:
        description: 'yahoo | sp500data (S&P 500 point-in-time con deslistadas)'
        required: false
        default: 'yahoo'
      tag:
        description: 'Release del repositorio de datos (source=sp500data)'
        required: false
        default: 'snapshot-2026-11'
permissions:
  contents: write
jobs:
  v24:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt lxml pyarrow
      - name: Pruebas del motor V24 y auditoría independiente
        run: python -m unittest tests.test_v24_engine tests.test_v24_audit tests.test_v24_sp500data tests.test_v24_h5 tests.test_v24_h6 tests.test_v24_h7 tests.test_v24_kell tests.test_system_backtest -v
      - name: Backtest V24 (investigación, sin órdenes)
        if: ${{ inputs.mode == 'backtest' || inputs.mode == '' }}
        env:
          SYMBOLS: ${{ inputs.symbols }}
          SEED: ${{ inputs.seed }}
          CAPITAL: ${{ inputs.capital }}
          FEE_MIN: ${{ inputs.fee_min }}
          MIN_ORDER: ${{ inputs.min_order }}
          FRACTIONAL: ${{ inputs.fractional }}
          SOURCE: ${{ inputs.source }}
          TAG: ${{ inputs.tag }}
        run: |
          F=""; [ "$FRACTIONAL" = "true" ] && F="--fractional"
          python v24_backtest.py --symbols "$SYMBOLS" --seed "$SEED" --capital "$CAPITAL" --fee-min "$FEE_MIN" --min-order "$MIN_ORDER" --source "$SOURCE" --tag "$TAG" $F --output data/v24_results.json
      - name: Contraste de hipótesis registradas H1-H4 (prueba final bloqueada)
        if: ${{ inputs.mode == 'hipotesis' }}
        run: python v24_hipotesis.py --output data/v24_hipotesis.json
      - name: Replicación independiente de H2 en 1997-2009 (prueba final bloqueada)
        if: ${{ inputs.mode == 'replica_h2' }}
        run: python v24_replica_h2.py --output data/v24_replica_h2.json
      - name: Contraste de H5, sistema de plan.html (prueba final bloqueada)
        if: ${{ inputs.mode == 'h5' }}
        run: python v24_h5.py --output data/v24_h5.json
      - name: Contraste de H6, momentum 63 sesiones (prueba final bloqueada)
        if: ${{ inputs.mode == 'h6' }}
        run: python v24_h6.py --output data/v24_h6.json
      - name: Límites y calidad de Tiingo para un universo amplio (no guarda precios)
        if: ${{ inputs.mode == 'tiingo_limites' }}
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python tiingo_limits.py data/v24_tiingo_limites.json
      - name: Contraste de H7, sistema tipo Minervini (prueba final bloqueada)
        if: ${{ inputs.mode == 'h7' }}
        run: python v24_h7.py --output data/v24_h7.json
      - name: H7 exploratoria en acciones que cotizan hoy (sesgo declarado; prueba final bloqueada)
        if: ${{ inputs.mode == 'h7_explor' }}
        run: python v24_h7_explor.py --output data/v24_h7_explor.json
      - name: Contraste de H8, sistema tipo Oliver Kell (prueba final bloqueada)
        if: ${{ inputs.mode == 'h8' }}
        run: python v24_kell.py --output data/v24_kell.json
      - name: Sondeo de Tiingo (lista pública y, si hay clave, precios de deslistadas)
        if: ${{ inputs.mode == 'tiingo' }}
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python tiingo_probe.py data/v24_tiingo.json
      - name: Sondeo de fuentes de datos con deslistadas (investigación)
        if: ${{ inputs.mode == 'fuentes' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python v24_data_sources.py data/v24_fuentes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: karryman-v24-resultados
          path: data/v24_*.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Guardar resultado en la rama de trabajo
        if: ${{ github.ref_name != 'main' && inputs.mode != 'tests' }}
        run: |
          mkdir -p results/v24
          for f in data/v24_*.json; do cp "$f" "results/v24/$(basename "$f" .json)_${{ github.run_id }}.json"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v24
          git commit -m "Resultados V24 (${{ inputs.mode }}, run ${{ github.run_id }}, commit ${{ github.sha }})"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
