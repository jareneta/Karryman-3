
name: Karryman Discovery

# Desactivado el horario: el universo viene ahora del screener de Stock Analysis (plan.yml).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: karryman-discovery
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan market
        env:
          DISCOVERY_BATCH: '400'
          FUNDAMENTAL_LOOKUPS: '50'
        run: python discovery.py

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery.json data/discovery_state.json data/discovery_watchlist.json data/discovery_fundamentals.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar Karryman Screener 3.0"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          
