name: Karryman Weekly Review
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 0'
permissions:
  contents: write
concurrency:
  group: karryman-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Generate public-data review
        run: python review.py
      - name: Commit public JSON only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/review.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar revisión semanal Karryman"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
