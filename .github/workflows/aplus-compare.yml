name: Karryman A+ Stop Research
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aplus-compare.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install -r requirements.txt
      - name: Compare A+ stop modes (research only)
        run: python aplus_stop_report.py --symbols SPY QQQ AAPL MSFT --period 5y
      - name: Archive private-to-CI research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karryman-aplus-stop-research
          path: data/aplus_stop_comparison.json
          if-no-files-found: warn
          retention-days: 14
