
name: Karryman Setups A+

# Desactivado el horario: el universo viene ahora del screener de Stock Analysis (plan.yml).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: karryman-setups
  cancel-in-progress: false

jobs:
  setups:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencias
        run: pip install -r requirements.txt

      - name: Detectar setups
        env:
          SETUP_MAX_SYMBOLS: '250'
        run: python setups.py

      - name: Plan de entradas y posiciones
        continue-on-error: true
        run: python plan.py

      - name: Guardar resultados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/setups.json data/screener.json data/plan.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar setups Karryman A+'
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          
