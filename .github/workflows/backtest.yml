name: Karryman Historical Research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Historical research (no broker)
        run: python backtest_report.py
      - name: Archive report without publishing to site
        uses: actions/upload-artifact@v4
        with:
          name: karryman-historical-baseline
          path: data/backtest_report.json
          retention-days: 30
