name: Karryman 4 End-to-End Research
# Desactivado el horario: el universo viene ahora del screener de Stock Analysis (plan.yml).
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Tickers de tus posiciones (solo tickers; vacío = mantener los anteriores)'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/full-pipeline.yml'
permissions:
  contents: write
concurrency:
  group: karryman-full-pipeline
  cancel-in-progress: false
jobs:
  full-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test engines
        run: |
          python -m unittest discover -s tests -v
          node tests/risk.test.cjs
          node tests/paper.test.cjs
          node tests/paper_ledger.test.cjs
          node tests/ibkr_import.test.cjs
          node tests/reconcile.test.cjs
          node tests/trade_manager.test.cjs
      - name: Discover US universe batch
        env:
          DISCOVERY_BATCH: '400'
          FUNDAMENTAL_LOOKUPS: '50'
        run: python discovery.py
      - name: Rank candidates
        run: python screener.py
      - name: Analyze technical A+ setups
        env:
          SETUP_MAX_SYMBOLS: '80'
        run: python setups.py
      - name: Generate mobile weekly review
        run: python review.py
      - name: Save position tickers (tickers only)
        if: github.event_name == 'workflow_dispatch' && inputs.tickers != ''
        env:
          TICKERS: ${{ inputs.tickers }}
        run: python tracked.py "$TICKERS"
      - name: Entry plan and position review
        continue-on-error: true
        run: python plan.py
      - name: Validate public output flags
        run: |
          python -c "import json; d=json.load(open('data/review.json')); assert d['orders_enabled'] is False and d['broker_connected'] is False and all(x['order_enabled'] is False for x in d['candidates']); print('Validated review:',d['review_count'])"
      - name: Publish public analysis to mobile app
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/discovery.json data/discovery_state.json data/discovery_watchlist.json data/discovery_fundamentals.json data/screener.json data/setups.json data/review.json data/plan.json
          if ls data/tracked.json >/dev/null 2>&1; then git add data/tracked.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Publicar análisis integral Karryman 4.0'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Archive research output (never positions or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karryman4-public-research-preview
          path: |
            data/discovery.json
            data/screener.json
            data/setups.json
            data/review.json
            data/plan.json
          if-no-files-found: warn
          retention-days: 7
