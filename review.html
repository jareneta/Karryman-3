<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karryman · Revisión</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1320;color:#e8eef7;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:18px}a{color:#9ac6ff}.card{background:#182538;border:1px solid #34445b;border-radius:15px;padding:17px;margin:14px 0}h1{font-size:1.5rem}h2{font-size:1.1rem;margin:0 0 10px}p{line-height:1.5;color:#b8c7d8}.tag{display:inline-block;border:1px solid #62778c;border-radius:30px;padding:5px 10px;font-size:.8rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}small{color:#b8c7d8}button{background:#315985;border:1px solid #608ab8;color:white;border-radius:9px;padding:12px;font:inherit}</style></head><body><main><a href="./">← Centro de control</a><h1>Revisión semanal · Karryman 4.0</h1><p>Propuestas informativas por cierres. No se envían órdenes ni se consulta IBKR.</p><div id="summary" class="card">Cargando…</div><div id="cards"></div><button id="refresh">Actualizar</button><script>
const $=id=>document.getElementById(id);
const fmt=n=>Number.isFinite(Number(n))?Number(n).toLocaleString('es-ES',{maximumFractionDigits:2}):'—';
function text(tag,value){const e=document.createElement(tag);e.textContent=String(value??'—');return e}
async function load(){try{const r=await fetch('data/review.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Revisión todavía no generada');const d=await r.json();$('summary').replaceChildren(text('h2','Estado de revisión'),text('p','Generada: '+(d.generated_utc||'—')),text('p','Candidatas: '+d.review_count+' · A+ técnicas: '+d.technical_a_plus_count),text('p','Cartera IBKR: NO conectada · Órdenes: DESACTIVADAS'));$('cards').replaceChildren();for(const x of d.candidates||[]){const c=document.createElement('article');c.className='card';c.append(text('h2',x.ticker+' · '+x.status),text('p',x.pattern+' · '+x.source+' · sesión '+(x.last_session||'—')));const g=document.createElement('div');g.className='grid';for(const [k,v] of [['Cierre referencia',fmt(x.entry_reference)+' $'],['Stop referencia',fmt(x.stop_reference)+' $'],['Objetivo +2R',fmt(x.target_2r_reference)+' $'],['Distancia al stop',fmt(x.risk_pct)+' %']]){const cell=document.createElement('div');cell.append(text('small',k),text('h2',v));g.append(cell)}c.append(g,text('p','Pendiente: '+(x.pending_checks||[]).join(' · ')));$('cards').append(c)}if(!d.candidates?.length)$('cards').append(text('p','No hay propuestas disponibles.'))}catch(e){$('summary').textContent='No disponible: '+e.message}}
$('refresh').onclick=load;load();
</script></main></body></html>
